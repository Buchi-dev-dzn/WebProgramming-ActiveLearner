global
  log stdout format raw local0
  maxconn 20000

defaults
  log global
  timeout connect 5s
  timeout client 30s
  timeout server 30s
  option dontlognull

frontend http_in
  bind :80
  mode http
  option httplog
  default_backend waf_http

frontend https_in
  bind :443
  mode tcp
  option tcplog
  default_backend waf_https

backend waf_http
  mode http
  option httpchk GET /health
  http-check expect status 200
  server waf waf:80 check

backend waf_https
  mode tcp
  server waf waf:443 check
