global
  log stdout format raw local0
  maxconn 20000

defaults
  log global
  timeout connect 5s
  timeout client 30s
  timeout server 30s
  option dontlognull

frontend http_in
  bind :80
  mode http
  option httplog

  # Track per-source rates so the inline proxy can drop obvious floods early.
  stick-table type ip size 100k expire 10m store conn_rate(10s),conn_cur,http_req_rate(10s)
  http-request track-sc0 src

  acl src_conn_abuse sc_conn_rate(0) gt 60
  acl src_conn_cur_abuse sc_conn_cur(0) gt 30
  acl src_req_abuse sc_http_req_rate(0) gt 120

  acl bad_ua hdr_sub(user-agent) -i sqlmap nikto nmap dirbuster gobuster wpscan
  acl bad_path path_reg -i (\.\./|\.\.%2f|/etc/passwd|/wp-admin|/wp-login\.php|/phpmyadmin)
  acl bad_query query -m reg -i (union(\s|%20)+select|sleep\s*\(|benchmark\s*\(|<script|%3cscript|or(\s|%20)+1=1)

  http-request deny deny_status 429 if src_conn_abuse or src_conn_cur_abuse or src_req_abuse
  http-request deny deny_status 403 if bad_ua or bad_path or bad_query

  default_backend reverse_proxy_http

frontend https_in
  bind :443
  mode tcp
  option tcplog

  tcp-request inspect-delay 5s
  stick-table type ip size 100k expire 10m store conn_rate(10s),conn_cur
  tcp-request connection track-sc0 src

  acl tls_conn_abuse sc_conn_rate(0) gt 40
  acl tls_conn_cur_abuse sc_conn_cur(0) gt 20
  acl client_hello req.ssl_hello_type 1

  tcp-request connection reject if tls_conn_abuse or tls_conn_cur_abuse
  tcp-request content reject if !client_hello

  default_backend reverse_proxy_https

backend reverse_proxy_http
  mode http
  option httpchk GET /health
  http-check expect status 200
  server rp reverse-proxy:80 check

backend reverse_proxy_https
  mode tcp
  server rp reverse-proxy:443 check
