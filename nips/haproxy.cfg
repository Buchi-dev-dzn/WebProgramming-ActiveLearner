global
  log stdout format raw local0
  maxconn 20000

defaults
  log global
  timeout connect 5s
  timeout client 30s
  timeout server 30s
  option dontlognull

frontend http_in
  bind :80
  mode http
  option httplog

  # Track per-source rates so the inline proxy can drop obvious floods early.
  stick-table type ip size 100k expire 10m store conn_rate(10s),conn_cur,http_req_rate(10s)
  http-request track-sc0 src

  acl src_conn_abuse sc_conn_rate(0) gt 60
  acl src_conn_cur_abuse sc_conn_cur(0) gt 30
  acl src_req_abuse sc_http_req_rate(0) gt 120

  http-request deny deny_status 429 if src_conn_abuse or src_conn_cur_abuse or src_req_abuse

  default_backend waf_http

frontend https_in
  bind :443 accept-proxy
  mode tcp
  option tcplog

  tcp-request inspect-delay 5s
  stick-table type ip size 100k expire 10m store conn_rate(10s),conn_cur
  tcp-request connection track-sc0 src

  acl tls_conn_abuse sc_conn_rate(0) gt 40
  acl tls_conn_cur_abuse sc_conn_cur(0) gt 20
  acl client_hello req.ssl_hello_type 1

  tcp-request connection reject if tls_conn_abuse or tls_conn_cur_abuse
  tcp-request content reject if !client_hello

  default_backend waf_https

backend waf_http
  mode http
  option httpchk GET /health
  http-check expect status 200
  server waf waf:80 check

backend waf_https
  mode tcp
  server waf waf:443 check send-proxy
