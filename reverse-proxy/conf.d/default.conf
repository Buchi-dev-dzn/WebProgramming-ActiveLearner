upstream application_upstream {
  server application:80;
  keepalive 16;
}

server {
  listen 80;
  listen 443 ssl;
  server_name _;

  ssl_certificate /etc/nginx/certs/dev.crt;
  ssl_certificate_key /etc/nginx/certs/dev.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  client_max_body_size 1m;

  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Request-Id $request_id always;

  proxy_intercept_errors on;
  error_page 502 503 504 /__errors/upstream-unavailable.json;

  location /health {
    access_log off;
    default_type text/plain;
    return 200 "reverse-proxy ok\n";
  }

  location = /api {
    return 301 /api/;
  }

  location /api/ {
    proxy_pass http://application_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Request-Id $request_id;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    proxy_next_upstream off;
  }

  location = /__errors/upstream-unavailable.json {
    internal;
    default_type application/json;
    return 503 '{"error":"upstream_unavailable"}';
  }

  location / {
    default_type application/json;
    return 404 '{"error":"not_found"}';
  }
}
