name: security-ec-3tier

services:
  external-firewall:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./external-firewall/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./logs/external-firewall:/var/log/nginx
    depends_on:
      - nips
    networks:
      - public_net
      - edge_net
    restart: unless-stopped

  nips:
    image: haproxy:2.9-alpine
    volumes:
      - ./nips/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - waf
    networks:
      - edge_net
    restart: unless-stopped

  waf:
    image: nginx:1.27-alpine
    volumes:
      - ./waf/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./waf/conf.d:/etc/nginx/conf.d:ro
      - ./waf/certs:/etc/nginx/certs:ro
      - ./logs/waf:/var/log/nginx
    depends_on:
      - reverse-proxy
    networks:
      - edge_net
    restart: unless-stopped

  reverse-proxy:
    image: nginx:1.27-alpine
    volumes:
      - ./reverse-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./reverse-proxy/conf.d:/etc/nginx/conf.d:ro
      - ./waf/certs:/etc/nginx/certs:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - application
    networks:
      - edge_net
      - app_net
    restart: unless-stopped

  application:
    build:
      context: .
      dockerfile: application/Dockerfile
    volumes:
      - ./logs/application:/var/log/application
    environment:
      PORT: "8080"
      DATABASE_URL: "postgresql://app_user:app_password@postgres:5432/app_db"
      LOG_DIR: "/var/log/application"
    depends_on:
      - postgres
    expose:
      - "80"
    networks:
      - app_net
      - db_net
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./logs/postgres:/var/log/postgresql
    expose:
      - "5432"
    networks:
      - db_net
    restart: unless-stopped

networks:
  public_net:
    driver: bridge
  edge_net:
    driver: bridge
    internal: true
  app_net:
    driver: bridge
    internal: true
  db_net:
    driver: bridge
    internal: true

volumes:
  postgres_data:
