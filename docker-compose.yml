name: security-ec-base

services:
  waf:
    image: nginx:1.27-alpine
    container_name: waf
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./waf/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./waf/conf.d:/etc/nginx/conf.d:ro
      - ./logs/waf:/var/log/nginx
    depends_on:
      - reverse-proxy
    networks:
      - public_net
      - edge_net
      - monitor_net
    restart: unless-stopped

  reverse-proxy:
    image: nginx:1.27-alpine
    container_name: reverse-proxy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - backend-api
    networks:
      - edge_net
      - app_net
      - monitor_net
    restart: unless-stopped

  backend-api:
    image: node:22-alpine
    container_name: backend-api
    working_dir: /app
    command: ["sh", "-c", "node server.js"]
    volumes:
      - ./backend:/app:ro
      - ./logs/backend:/var/log/backend
    environment:
      PORT: "8080"
      DATABASE_URL: "postgresql://app_user:app_password@postgres:5432/app_db"
      REDIS_URL: "redis://redis:6379"
      LOG_DIR: "/var/log/backend"
    depends_on:
      - postgres
      - redis
    expose:
      - "8080"
    networks:
      - app_net
      - db_net
      - monitor_net
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./logs/postgres:/var/log/postgresql
    expose:
      - "5432"
    networks:
      - db_net
      - monitor_net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    networks:
      - db_net
    restart: unless-stopped

  log-viewer:
    image: grafana/grafana:11.1.0
    container_name: log-viewer
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - monitor_net
    restart: unless-stopped
    profiles:
      - monitoring

  # NIDS/HIDS placeholder:
  # - Prefer host-level deployment for Suricata / Wazuh agent on the VM
  # - Optionally add monitoring-sidecar containers later if the assignment requires it

networks:
  public_net:
    driver: bridge
    name: public_net
  edge_net:
    driver: bridge
    internal: true
    name: edge_net
  app_net:
    driver: bridge
    internal: true
    name: app_net
  db_net:
    driver: bridge
    internal: true
    name: db_net
  monitor_net:
    driver: bridge
    internal: true
    name: monitor_net

volumes:
  postgres_data:
  redis_data:
  grafana_data:
