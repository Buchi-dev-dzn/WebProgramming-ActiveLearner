name: security-ec-3tier

services:
  external-firewall:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./external-firewall/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./logs/external-firewall:/var/log/nginx
    depends_on:
      - nips
    networks:
      - public_net
      - edge_net
    restart: unless-stopped

  nips:
    image: haproxy:2.9-alpine
    volumes:
      - ./nips/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - waf
    networks:
      - edge_net
    restart: unless-stopped

  waf:
    image: nginx:1.27-alpine
    volumes:
      - ./waf/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./waf/conf.d:/etc/nginx/conf.d:ro
      - ./waf/certs:/etc/nginx/certs:ro
      - ./logs/waf:/var/log/nginx
    depends_on:
      - reverse-proxy
    networks:
      - edge_net
    restart: unless-stopped

  reverse-proxy:
    image: nginx:1.27-alpine
    volumes:
      - ./reverse-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./reverse-proxy/conf.d:/etc/nginx/conf.d:ro
      - ./waf/certs:/etc/nginx/certs:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - internal-firewall
    networks:
      edge_net:
      app_net:
        ipv4_address: 172.30.0.10
    restart: unless-stopped

  internal-firewall:
    build:
      context: .
      dockerfile: internal-firewall/Dockerfile
    volumes:
      - ./logs/internal-firewall:/var/log/internal-firewall
    depends_on:
      - fastapi-app
    expose:
      - "80"
    networks:
      app_net:
        ipv4_address: 172.30.0.20
      api_net:
        ipv4_address: 172.31.0.10
    restart: unless-stopped

  fastapi-app:
    build:
      context: .
      dockerfile: fastapi/Dockerfile
    environment:
      DATABASE_URL: "postgresql://app_user:app_password@postgres:5432/app_db"
      JWT_SECRET_KEY_B64: "yZgC+H8/qddXnBGJK9JPMWlX9Q7a2ZeRYbgMC84AS0U="
      DATA_ENCRYPTION_KEY_B64: "dwRZKYwS/C7pjAsT5hTxTEeBvt5xY3BmAezwguX1xIo="
      EMAIL_LOOKUP_KEY_B64: "H2nQK3mmpz5gZTS3M0Yp5JUoNCapunuPabaB/cyd0F4="
      SECURITY_SENSOR_TOKEN: "dev-security-sensor-token"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
    depends_on:
      - postgres
    expose:
      - "8000"
    networks:
      api_net:
        ipv4_address: 172.31.0.20
      db_net:
    restart: unless-stopped

  nids:
    build:
      context: .
      dockerfile: nids/Dockerfile
    environment:
      NIDS_SOURCE_DIR: /sources
      NIDS_ALERT_PATH: /alerts/alerts.log
      NIDS_STATE_PATH: /alerts/state.json
      NIDS_SCAN_INTERVAL_SECONDS: 5
      NIDS_INGEST_URL: http://fastapi-app:8000/api/internal/security-events
      SECURITY_SENSOR_TOKEN: "dev-security-sensor-token"
    volumes:
      - ./logs/external-firewall:/sources/external-firewall:ro
      - ./logs/waf:/sources/waf:ro
      - ./logs/nginx:/sources/reverse-proxy:ro
      - ./logs/internal-firewall:/sources/internal-firewall:ro
      - ./logs/nids:/alerts
    depends_on:
      - external-firewall
      - nips
      - waf
      - reverse-proxy
      - internal-firewall
      - fastapi-app
    networks:
      - edge_net
      - app_net
      - api_net
    restart: unless-stopped

  hids-hips:
    build:
      context: .
      dockerfile: hids/Dockerfile
    environment:
      HIDS_WATCH_DIR: /watch/fastapi-app
      HIDS_ALERT_PATH: /alerts/alerts.log
      HIDS_BASELINE_PATH: /alerts/baseline.json
      HIDS_HEALTH_URL: http://fastapi-app:8000/api/health
      HIDS_SCAN_INTERVAL_SECONDS: 10
      HIDS_INGEST_URL: http://fastapi-app:8000/api/internal/security-events
      SECURITY_SENSOR_TOKEN: "dev-security-sensor-token"
    volumes:
      - ./fastapi/app:/watch/fastapi-app:ro
      - ./logs/hids:/alerts
    depends_on:
      - fastapi-app
    networks:
      - api_net
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_admin_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - ./logs/postgres:/var/log/postgresql
    expose:
      - "5432"
    networks:
      - db_net
    restart: unless-stopped

networks:
  public_net:
    driver: bridge
  edge_net:
    driver: bridge
    internal: true
  app_net:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
  api_net:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.31.0.0/24
  db_net:
    driver: bridge
    internal: true

volumes:
  postgres_data:
