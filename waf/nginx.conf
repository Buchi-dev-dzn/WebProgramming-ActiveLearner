events {}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # HTTPS arrives from HAProxy with PROXY protocol. HTTP health checks do not,
  # so fall back to the immediate peer for that listener.
  map $proxy_protocol_addr $client_ip {
    default $proxy_protocol_addr;
    ""      $remote_addr;
  }

  limit_req_zone $client_ip zone=waf_req_rate:10m rate=20r/s;

  log_format main '$client_ip - $remote_user [$time_local] '
                  '"$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent"';

  access_log /var/log/nginx/access.log main;
  error_log  /var/log/nginx/error.log warn;

  sendfile on;
  keepalive_timeout 65;
  server_tokens off;
  ignore_invalid_headers on;
  underscores_in_headers off;

  include /etc/nginx/conf.d/*.conf;
}
