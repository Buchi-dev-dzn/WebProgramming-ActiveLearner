map $http_user_agent $blocked_ua {
  default 0;
  ~*(sqlmap|nikto|nmap|dirbuster|gobuster|wpscan) 1;
}

map $http_x_original_url $blocked_override_header {
  default 0;
  ~.+ 1;
}

map $http_x_rewrite_url $blocked_rewrite_header {
  default 0;
  ~.+ 1;
}

map $request_uri $blocked_path {
  default 0;
  ~*(\.\./|\.\.%2f|%2e%2e%2f|%2e%2e/|%252e%252e%252f|%5c|/etc/passwd|/wp-admin|/wp-login\.php|/phpmyadmin|/\.git|/\.env|/server-status|/actuator|/admin|/console|/boaform) 1;
}

map $query_string $blocked_query {
  default 0;
  ~*(union(\s|%20|\+)+select|select(\s|%20|\+)+.*(\s|%20|\+)+from|sleep\s*\(|benchmark\s*\(|<script|%3cscript|<svg|%3csvg|javascript:|onerror\s*=|onload\s*=|or(\s|%20|\+)+1=1|information_schema|load_file\s*\(|into(\s|%20|\+)+outfile|\.\./|%2e%2e|%252e%252e|\$\{jndi:) 1;
}

map $request_method:$uri $blocked_route {
  default 1;
  GET:/ 0;
  HEAD:/ 0;
  GET:/health 0;
  HEAD:/health 0;
  GET:/api/health 0;
  HEAD:/api/health 0;
  GET:/api/info 0;
  HEAD:/api/info 0;
  GET:/api/products 0;
  HEAD:/api/products 0;
  POST:/api/products 0;
  GET:/api/product 0;
  HEAD:/api/product 0;
  POST:/api/product/stock 0;
  POST:/api/health 0;
  POST:/api/info 0;
}

server {
  listen 80;
  listen 443 ssl;
  server_name _;

  ssl_certificate /etc/nginx/certs/dev.crt;
  ssl_certificate_key /etc/nginx/certs/dev.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  client_max_body_size 256k;

  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

  if ($request_method !~ ^(GET|HEAD|POST)$) {
    return 405;
  }

  if ($blocked_route = 1) {
    return 404;
  }

  if ($blocked_ua = 1) {
    return 403;
  }

  if ($blocked_override_header = 1) {
    return 403;
  }

  if ($blocked_rewrite_header = 1) {
    return 403;
  }

  if ($blocked_path = 1) {
    return 403;
  }

  if ($blocked_query = 1) {
    return 403;
  }

  location /health {
    access_log off;
    proxy_pass http://reverse-proxy:80;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = / {
    limit_req zone=waf_req_rate burst=20 nodelay;
    proxy_pass http://reverse-proxy:80;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /api/health {
    limit_req zone=waf_req_rate burst=20 nodelay;
    proxy_pass http://reverse-proxy:80;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /api/info {
    limit_req zone=waf_req_rate burst=20 nodelay;
    proxy_pass http://reverse-proxy:80;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /api/products {
    limit_req zone=waf_req_rate burst=20 nodelay;
    proxy_pass http://reverse-proxy:80;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /api/product {
    limit_req zone=waf_req_rate burst=20 nodelay;
    proxy_pass http://reverse-proxy:80;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /api/product/stock {
    limit_req zone=waf_req_rate burst=20 nodelay;
    proxy_pass http://reverse-proxy:80;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    limit_req zone=waf_req_rate burst=20 nodelay;
    proxy_pass http://reverse-proxy:80;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
