map $http_user_agent $blocked_ua {
  default 0;
  ~*(sqlmap|nikto|nmap|dirbuster|gobuster|wpscan) 1;
}

map $request_uri $blocked_path {
  default 0;
  ~*(\.\./|\.\.%2f|/etc/passwd|/wp-admin|/wp-login\.php|/phpmyadmin) 1;
}

map $query_string $blocked_query {
  default 0;
  ~*(union(\s|%20)+select|sleep\s*\(|benchmark\s*\(|<script|%3cscript|or(\s|%20)+1=1) 1;
}

server {
  listen 80;
  listen 443 ssl;
  server_name _;

  ssl_certificate /etc/nginx/certs/dev.crt;
  ssl_certificate_key /etc/nginx/certs/dev.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  client_max_body_size 1m;

  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

  if ($request_method !~ ^(GET|HEAD|POST)$) {
    return 405;
  }

  if ($blocked_ua = 1) {
    return 403;
  }

  if ($blocked_path = 1) {
    return 403;
  }

  if ($blocked_query = 1) {
    return 403;
  }

  location /health {
    access_log off;
    return 200 "waf ok\n";
  }

  location / {
    proxy_pass http://reverse-proxy:80;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
