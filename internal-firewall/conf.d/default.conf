upstream fastapi_upstream {
  server 172.31.0.20:8000;
  keepalive 16;
}

server {
  listen 80;
  server_name _;

  # Only the DMZ reverse proxy may enter this internal boundary.
  allow 172.30.0.10;
  deny all;

  client_max_body_size 1m;

  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;

  proxy_intercept_errors on;
  error_page 502 504 /__errors/upstream-unavailable.json;

  location = /health {
    access_log off;
    default_type application/json;
    return 200 '{"service":"internal-firewall","status":"ok"}';
  }

  location = /api {
    return 301 /api/;
  }

  location /api/ {
    proxy_pass http://fastapi_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_x_real_ip;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Request-Id $http_x_request_id;
    proxy_connect_timeout 1s;
    proxy_send_timeout 5s;
    proxy_read_timeout 5s;
    proxy_next_upstream off;
  }

  location = /__errors/upstream-unavailable.json {
    internal;
    default_type application/json;
    return 503 '{"error":"upstream_unavailable"}';
  }

  location / {
    default_type application/json;
    return 403 '{"error":"forbidden"}';
  }
}
