worker_processes auto;

events {
  worker_connections 1024;
}

stream {
  log_format stream_main '$remote_addr [$time_local] '
                         '$protocol $status $bytes_sent $bytes_received '
                         '$session_time "$upstream_addr"';

  access_log /var/log/nginx/access.log stream_main;
  error_log /var/log/nginx/error.log warn;

  upstream waf_http {
    server waf:80;
  }

  upstream waf_https {
    server waf:443;
  }

  # FW1 policy in this lab:
  # - source: any
  # - destination whitelist: 80 and 443 only
  # - default deny for all other destination ports by not exposing/listening on them
  server {
    listen 80;
    proxy_pass waf_http;
  }

  server {
    listen 443;
    proxy_pass waf_https;
  }
}
