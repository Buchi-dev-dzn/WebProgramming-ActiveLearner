worker_processes auto;

events {
  worker_connections 1024;
}

stream {
  log_format stream_main '$remote_addr [$time_local] '
                         '$protocol $status $bytes_sent $bytes_received '
                         '$session_time "$upstream_addr"';

  access_log /var/log/nginx/access.log stream_main;
  error_log /var/log/nginx/error.log warn;

  upstream nips_https {
    server nips:443;
  }

  # FW1 in this lab is a dedicated L4 gateway:
  # - source: any
  # - destination whitelist at the Docker entrypoint: 443 only
  # - reverse-proxy is not published directly to the host
  # - all traffic must pass through NIPS before reaching the DMZ reverse proxy
  server {
    listen 443;
    proxy_pass nips_https;
    # Preserve the client address through the L4 security chain.  Without
    # PROXY protocol, every downstream rate limit sees this container's IP.
    proxy_protocol on;
  }
}
